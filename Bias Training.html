<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Examining Our Biases — K-5 Educator Training</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter+Tight:wght@400;500;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body, #root { margin:0; padding:0; height:100%; width:100%; overflow:hidden; background:#f0eee9; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    /* Hide scrollbars inside artboards for cleaner presentation */
    .dc-card *::-webkit-scrollbar { display:none; }
    .dc-card * { scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
      <rect width="400" height="400" fill="#f3ede0"/>
      <g transform="translate(120, 120)">
        <circle cx="80" cy="80" r="78" fill="none" stroke="#8a3f2a" stroke-width="3"/>
        <circle cx="80" cy="80" r="58" fill="none" stroke="#8a3f2a" stroke-width="2" stroke-dasharray="3 5"/>
        <circle cx="80" cy="80" r="10" fill="#8a3f2a"/>
        <line x1="80" y1="0" x2="80" y2="160" stroke="#8a3f2a" stroke-width="1.5" opacity="0.4"/>
        <line x1="0" y1="80" x2="160" y2="80" stroke="#8a3f2a" stroke-width="1.5" opacity="0.4"/>
      </g>
      <text x="200" y="320" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#2a2420">Examining Our Biases</text>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="data/scenarios.jsx"></script>
  <script type="text/babel" src="variations/v1-editorial.jsx"></script>
  <script type="text/babel" src="variations/v2-documentary.jsx"></script>
  <script type="text/babel" src="variations/v3-workbook.jsx"></script>

  <script type="text/babel">
    // Tweak defaults — editable at rest, live via __edit_mode messages.
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "gradeBand": "all"
    }/*EDITMODE-END*/;

    function App() {
      const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
      const [panelOpen, setPanelOpen] = React.useState(false);

      React.useEffect(() => {
        const handler = (e) => {
          const d = e.data || {};
          if (d.type === '__activate_edit_mode') setPanelOpen(true);
          if (d.type === '__deactivate_edit_mode') setPanelOpen(false);
        };
        window.addEventListener('message', handler);
        // Signal availability AFTER the listener is attached.
        window.parent.postMessage({ type: '__edit_mode_available' }, '*');
        return () => window.removeEventListener('message', handler);
      }, []);

      const setBand = (gradeBand) => {
        setTweaks((t) => ({ ...t, gradeBand }));
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { gradeBand } }, '*');
      };

      const band = tweaks.gradeBand;

      return (
        <>
          <DesignCanvas>
            <DCSection id="intro" title="Examining Our Biases"
              subtitle="A 10-part microlearning series for K-5 educators · three design directions">
              <DCArtboard id="about" label="About · read me first" width={520} height={720}>
                <AboutCard />
              </DCArtboard>
            </DCSection>

            <DCSection id="v1" title="Direction 1 · Editorial Reflection"
              subtitle="Journal-like, serif-led, warm paper tones. For teachers who want to sit with the work.">
              <DCArtboard id="v1-full" label="Full prototype · 10 modules" width={960} height={720}>
                <V1_Editorial gradeBand={band} />
              </DCArtboard>
              <DCArtboard id="v1-mod3" label="Preview · Module 3 state" width={520} height={720}>
                <V1_Editorial gradeBand={band} />
              </DCArtboard>
            </DCSection>

            <DCSection id="v2" title="Direction 2 · Documentary Vignettes"
              subtitle="Photo-led, cinematic. Case-study series with a dark stage and warm accents.">
              <DCArtboard id="v2-full" label="Full prototype · episode grid + detail" width={1100} height={720}>
                <V2_Documentary gradeBand={band} />
              </DCArtboard>
              <DCArtboard id="v2-detail" label="Preview · episode detail" width={520} height={720}>
                <V2_Documentary gradeBand={band} />
              </DCArtboard>
            </DCSection>

            <DCSection id="v3" title="Direction 3 · Workbook / Zine"
              subtitle="Tactile, handwritten accents, tabbed pages. Feels like a teacher's working notebook.">
              <DCArtboard id="v3-full" label="Full prototype · tabbed workbook" width={960} height={720}>
                <V3_Workbook gradeBand={band} />
              </DCArtboard>
              <DCArtboard id="v3-entry" label="Preview · a single entry" width={520} height={720}>
                <V3_Workbook gradeBand={band} />
              </DCArtboard>
            </DCSection>
          </DesignCanvas>

          {panelOpen && <TweaksPanel band={band} onBand={setBand} />}
        </>
      );
    }

    function AboutCard() {
      return (
        <div style={{
          height: '100%', padding: 40, boxSizing: 'border-box',
          background: '#f3ede0', color: '#2a2420',
          fontFamily: '"Source Serif 4", Georgia, serif', overflowY: 'auto'
        }}>
          <div style={{ fontSize: 10, letterSpacing: 3, textTransform: 'uppercase', color: '#8a7d6c', marginBottom: 14 }}>
            An interactive prototype · three directions
          </div>
          <h1 style={{ fontSize: 40, lineHeight: 1.05, fontWeight: 500, letterSpacing: -0.8, margin: '0 0 16px' }}>
            Examining our biases in the conversations we have about students of color.
          </h1>
          <p style={{ fontSize: 15.5, lineHeight: 1.6, color: '#5a4f44', margin: '0 0 20px' }}>
            A microlearning series for K-5 educators. Ten 5-to-7 minute modules,
            each built around a real classroom moment: a referral, a conference,
            a staff-lounge aside, a grading pass. You pick what you'd do,
            read what the research says, and end each module by committing to
            one small, specific habit.
          </p>
          <div style={{ borderTop: '1px solid #c9bca4', margin: '24px 0 20px' }} />
          <div style={{ fontSize: 11, letterSpacing: 2, color: '#8a3f2a', textTransform: 'uppercase', marginBottom: 10, fontWeight: 600 }}>
            The ten modules
          </div>
          <ol style={{ margin: 0, padding: '0 0 0 22px', fontSize: 13.5, lineHeight: 1.7, color: '#2a2420' }}>
            {SCENARIOS.map((s) => (
              <li key={s.id}><em>{s.title}</em> — <span style={{ color: '#8a7d6c' }}>{s.category}</span></li>
            ))}
          </ol>
          <div style={{ borderTop: '1px solid #c9bca4', margin: '24px 0 20px' }} />
          <div style={{ fontSize: 11, letterSpacing: 2, color: '#8a3f2a', textTransform: 'uppercase', marginBottom: 10, fontWeight: 600 }}>
            How it's grounded
          </div>
          <p style={{ fontSize: 13.5, lineHeight: 1.6, color: '#5a4f44', margin: '0 0 14px' }}>
            Culturally Responsive Teaching (Hammond) paired with the implicit-bias
            research lineage (Banaji & Greenwald, Project Implicit). Every choice
            and research pull is tagged to specific findings.
          </p>
          <div style={{ fontSize: 11, letterSpacing: 2, color: '#8a3f2a', textTransform: 'uppercase', marginBottom: 10, fontWeight: 600 }}>
            Psychological safety
          </div>
          <ul style={{ margin: 0, padding: '0 0 0 22px', fontSize: 13.5, lineHeight: 1.7, color: '#5a4f44' }}>
            <li>"Step away" always visible — no timer, no scoring</li>
            <li>"I'm not sure" is a valid answer on every scenario</li>
            <li>Responses stored locally only; never transmitted</li>
            <li>Scenarios open with context, not gotcha</li>
          </ul>
          <div style={{ borderTop: '1px solid #c9bca4', margin: '24px 0 20px' }} />
          <div style={{ fontSize: 12, color: '#8a7d6c', fontStyle: 'italic', lineHeight: 1.55 }}>
            Three directions live below — same content, three voices. Toggle
            Tweaks (top-right) to shift the scenario copy between K-2 and 3-5
            grade bands.
          </div>
        </div>
      );
    }

    function TweaksPanel({ band, onBand }) {
      const opts = [
        { id: 'all', label: 'K-5 · mid-range copy' },
        { id: 'k2', label: 'K-2 · early-elementary' },
        { id: 'g35', label: '3-5 · upper-elementary' }
      ];
      return (
        <div style={{
          position: 'fixed', right: 20, bottom: 20, zIndex: 999,
          background: '#1e1a17', color: '#f0ebe3',
          padding: '14px 16px 16px', borderRadius: 10, width: 240,
          boxShadow: '0 10px 40px rgba(0,0,0,.3)',
          fontFamily: '"Inter Tight", system-ui, sans-serif', fontSize: 13
        }}>
          <div style={{ fontSize: 10, letterSpacing: 2, color: '#d9a06a', textTransform: 'uppercase', marginBottom: 10, fontWeight: 600 }}>
            Tweaks
          </div>
          <div style={{ fontSize: 12, color: '#a39a8e', marginBottom: 10 }}>
            Grade-band focus
          </div>
          {opts.map((o) => (
            <button key={o.id} onClick={() => onBand(o.id)}
              style={{
                display: 'block', width: '100%', textAlign: 'left',
                padding: '8px 10px', marginBottom: 4,
                background: band === o.id ? '#2a2420' : 'transparent',
                border: `1px solid ${band === o.id ? '#d9a06a' : '#3a332d'}`,
                color: '#f0ebe3', cursor: 'pointer', fontFamily: 'inherit', fontSize: 12.5,
                borderRadius: 6
              }}>
              {o.label}
            </button>
          ))}
          <div style={{ fontSize: 10.5, color: '#6a6258', marginTop: 8, lineHeight: 1.4 }}>
            Swaps specific details in scenarios 1 & 4. Other modules read the same across bands.
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
